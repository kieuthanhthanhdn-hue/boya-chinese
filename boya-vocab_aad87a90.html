function ad(){$('v').innerHTML=`<h3>Thêm từ mới</h3><p class="meta">Dán từ Excel (mỗi dòng một từ, các cột cách nhau bằng Tab hoặc dấu |). Thứ tự cột: Bài, Chữ Hán, Pinyin, Từ loại, Hán Việt, Tiếng Anh, Nghĩa Việt, Chiết tự / bộ thủ, Mẹo nhớ, Câu ví dụ (tách từ bằng dấu cách), Dịch câu. Có thể thêm tối đa 4 cặp Câu và Dịch nữa. Chữ Hán trùng sẽ được cập nhật.</p><textarea id="ta" placeholder="5	你好	nǐ hǎo	..."></textarea><div class="row"><button id="ab">Thêm vào</button></div><h3>Nhập từ file Excel</h3><p class=\"meta\">Chọn file .xlsx theo mẫu (sheet đầu tiên).</p><input type=\"file\" id=\"xf\" accept=\".xlsx,.xls,.csv\" style=\"width:100%\"><h3>Mục tiêu mỗi ngày</h3><p class='meta'>Số lượt ôn mỗi ngày, và số từ mới tối đa mỗi ngày.</p><div class='row'><input id='g1' type='number' min='1' value='${S.log._g||20}'><input id='g2' type='number' min='1' value='${S.log._nw||10}'></div><h3>Google Sheet</h3><p class='meta'>Dán link Sheet đã Publish to web ở dạng CSV. App tự cập nhật từ mới mỗi lần mở. Chỉ chạy ở bản web riêng (Netlify).</p><input id='gu' placeholder='https://docs.google.com/spreadsheets/d/e/.../pub?output=csv' value='${esc(shv())}' style='width:100%'><div class='row'><button id='gb'>Cập nhật từ Sheet</button></div><h3>Đồng bộ giữa các máy</h3><p class='meta'>Cần tài khoản Supabase miễn phí và chỉ chạy ở bản web riêng (Netlify). Nhập cùng một bộ thông tin trên mỗi máy.</p><input id='su' placeholder='Supabase URL' value='${esc(cfg().u||'')}' style='width:100%;margin-top:6px'><input id='sk' placeholder='anon key' value='${esc(cfg().k||'')}' style='width:100%;margin-top:6px'><input id='sc' placeholder='Mã đồng bộ (chuỗi dài tự đặt)' value='${esc(cfg().c||'')}' style='width:100%;margin-top:6px'><div class='row'><button id='sb2'>Đồng bộ ngay</button></div><h3>Sao lưu</h3><p class="meta">Xuất ra ô trên, copy lưu lại. Khôi phục bằng cách dán vào rồi bấm Khôi phục.</p><div class="row"><button id="ex">Xuất</button><button id="im">Khôi phục</button></div><div class="row"><button class="q" id="rs2">Xóa tiến độ</button></div><p id="ms" class="meta"></p>`;
 const ms=t=>$('ms').textContent=t;
 $('xf').onchange=e=>{const f=e.target.files[0];if(!f)return;if(typeof XLSX==='undefined')return ms('Không tải được bộ đọc Excel. Hãy copy các dòng từ Excel rồi dán vào ô phía trên.');const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});const n=parse(rows.filter(x=>String(x[0]).trim()!=='Bài').map(x=>Array.from(x,c=>String(c??'')).join('\t')).join('\n'));if(!n.length)return ms('File không có dòng từ vựng hợp lệ.');n.forEach(x=>{const i=S.w.findIndex(w=>w.id===x.id);i<0?S.w.push(x):S.w[i]=x});save();filt();$('f').value=S.flt;$('cnt').textContent=pool().length+' từ';ms('Đã nhập '+n.length+' từ từ file '+f.name+'.')}catch(err){ms('Không đọc được file này.')}};r.readAsArrayBuffer(f)};
 $('gb').onclick=()=>{try{localStorage.setItem(SH,$('gu').value.trim())}catch(e){}gs(ms)};$('sb2').onclick=()=>{try{localStorage.setItem(SK,JSON.stringify({u:$('su').value.trim(),k:$('sk').value.trim(),c:$('sc').value.trim()}))}catch(e){}sy(ms)};$('g1').onchange=$('g2').onchange=()=>{S.log._g=Math.max(1,+$('g1').value||20);S.log._nw=Math.max(1,+$('g2').value||10);save();ms('Đã lưu mục tiêu.')};$('ab').onclick=()=>{const n=parse($('ta').value);if(!n.length)return ms('Không đọc được dòng nào. Kiểm tra lại cách ngăn cột.');n.forEach(x=>{const i=S.w.findIndex(w=>w.id===x.id);i<0?S.w.push(x):S.w[i]=x});save();filt();$('f').value=S.flt;$('cnt').textContent=pool().length+' từ';ms('Đã thêm hoặc cập nhật '+n.length+' từ.');$('ta').value=''};
 $('ex').onclick=()=>{$('ta').value=JSON.stringify({w:S.w,p:S.p,log:S.log,tests:S.tests});$('ta').select();ms('Đã xuất. Hãy copy toàn bộ nội dung ô trên.')};
 $('im').onclick=()=>{try{const j=JSON.parse($('ta').value);if(!Array.isArray(j.w))throw 0;S.w=j.w;S.p=j.p||{};S.log=j.log||{};S.tests=j.tests||[];save();filt();ms('Đã khôi phục '+S.w.length+' từ.')}catch(e){ms('Dữ liệu sao lưu không hợp lệ.')}};
 $('rs2').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ ôn tập?')){S.p={};S.log={};S.tests=[];save();ms('Đã xóa tiến độ.')}}}
load();filt();go('fc');if(cfg().c)sy(()=>{},1);if(shv())gs(()=>{},1);
</script></body></html>
